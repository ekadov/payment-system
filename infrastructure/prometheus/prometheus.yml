global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'individuals-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['individuals-api:8081']

    relabel_configs:
      - target_label: env
        replacement: 'production'

  - job_name: 'person-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['person-service:8082']

    relabel_configs:
      - target_label: env
        replacement: 'production'
