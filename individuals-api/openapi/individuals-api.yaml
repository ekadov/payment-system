openapi: 3.0.0
info:
  title: Individuals API
  description: REST API для регистрации, логина, обновления токена и получения информации о пользователе через Keycloak.
  version: 1.0.0
servers:
  - url: http://localhost:8081/v1

paths:
  /auth/registration:
    post:
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: Успешная регистрация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Пользователь уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Аутентификация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh-token:
    post:
      summary: Обновление токена доступа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Токен успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Недействительный или просроченный refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      summary: Получение данных текущего пользователя
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Кошельки и транзакции: Individuals API проверяет, что userUid совпадает с sub токена,
  # и пересылает запрос в Transaction Service. Модели — из контракта Transaction Service.
  # Ошибки Transaction Service (400, 404, 409) возвращаются с тем же кодом и телом.
  /wallets:
    post:
      summary: Создание кошелька текущего пользователя
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/CreateWalletRequest'
      responses:
        '201':
          description: Кошелёк создан
          content:
            application/json:
              schema:
                $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/WalletResponse'
        '401': &unauthorized
          description: Нет или недействителен Bearer-токен
        '403': &forbidden
          description: userUid не совпадает с sub токена
        '409':
          description: Кошелёк с таким именем уже существует

  /wallets/{walletUid}:
    get:
      summary: Кошелёк текущего пользователя
      security:
        - bearerAuth: [ ]
      parameters:
        - name: walletUid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Кошелёк
          content:
            application/json:
              schema:
                $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/WalletResponse'
        '401': *unauthorized
        '403':
          description: Кошелёк принадлежит другому пользователю
        '404':
          description: Кошелёк не найден

  /wallets/user/{userUid}:
    get:
      summary: Кошельки текущего пользователя
      security:
        - bearerAuth: [ ]
      parameters:
        - name: userUid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Кошельки пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/WalletResponse'
        '401': *unauthorized
        '403': *forbidden

  /transactions/{type}/init:
    post:
      summary: Расчёт условий операции без записи в БД
      security:
        - bearerAuth: [ ]
      parameters:
        - &transactionTypeParam
          name: type
          in: path
          required: true
          schema:
            $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/TransactionType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Комиссия, итоговая сумма и доступность операции
          content:
            application/json:
              schema:
                $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/TransactionInitResponse'
        '400':
          description: Ошибка валидации
        '401': *unauthorized
        '403': *forbidden

  /transactions/{type}/confirm:
    post:
      summary: Подтверждение операции
      security:
        - bearerAuth: [ ]
      parameters:
        - *transactionTypeParam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Транзакция создана (deposit/withdrawal — PENDING, transfer — COMPLETED)
          content:
            application/json:
              schema:
                $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/TransactionConfirmResponse'
        '400':
          description: Ошибка валидации
        '401': *unauthorized
        '403': *forbidden
        '409':
          description: Недостаточно средств или кошелёк неактивен

  /transactions/{transactionId}/status:
    get:
      summary: Статус транзакции текущего пользователя
      security:
        - bearerAuth: [ ]
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Транзакция
          content:
            application/json:
              schema:
                $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/TransactionStatusResponse'
        '401': *unauthorized
        '403':
          description: Транзакция принадлежит другому пользователю
        '404':
          description: Транзакция не найдена

  /transactions:
    get:
      summary: Поиск транзакций текущего пользователя (userUid берётся из токена)
      security:
        - bearerAuth: [ ]
      parameters:
        - name: walletUid
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/TransactionType'
        - name: status
          in: query
          schema:
            $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/TransactionStatus'
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Страница транзакций
          content:
            application/json:
              schema:
                $ref: '../../transaction-service/openapi/transaction-service.yaml#/components/schemas/TransactionPageResponse'
        '401': *unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegistrationRequest:
      type: object
      required: [ email, password, confirm_password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        confirm_password:
          type: string

    UserLoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenRefreshRequest:
      type: object
      required: [ refresh_token ]
      properties:
        refresh_token:
          type: string

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          example: Bearer

    UserInfoResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        status:
          type: integer